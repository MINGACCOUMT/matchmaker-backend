version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: matchmaker-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: matchmaker_root_2024
      MYSQL_DATABASE: matchmaker
      MYSQL_USER: matchmaker
      MYSQL_PASSWORD: matchmaker_pass_2024
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
